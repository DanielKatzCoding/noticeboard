{% extends "base.html" %}

{% block title %}{{ notice.title }}{% endblock %}

{% block content %}
<article class="notice-detail">
    <h2>{{ notice.title }}</h2>
    <p class="meta">{{ notice.created_at }}</p>
    <div class="body">{{ notice.content|linebreaks }}</div>
    <p><a href="{% url 'noticeboard_list' %}">Back to list</a></p>
</article>
{% endblock %}
